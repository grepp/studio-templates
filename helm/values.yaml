# values.yaml — Helm 기본값
# 운영 배포 시 values-prod.yaml을 별도 작성하여 오버라이드하세요.
# 민감정보(비밀번호, Secret Key)는 여기에 포함하지 마세요 — K8s Secret 사용.

# 이미지 설정
image:
  repository: your-registry/my-service   # TODO: 실제 레지스트리로 변경
  tag: "latest"
  pullPolicy: IfNotPresent

# 레플리카 수
replicaCount: 2

# 서비스 설정
service:
  type: ClusterIP
  port: 80
  targetPort: 8000

# Ingress
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  host: my-service.example.com           # TODO: 실제 도메인으로 변경
  tls:
    enabled: true
    secretName: my-service-tls

# 리소스 제한
resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# 오토스케일링
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# 환경 변수 (비민감)
env:
  APP_ENV: production
  APP_PORT: "8000"
  LOG_LEVEL: INFO
  LOG_FORMAT: json

# 민감 환경 변수는 K8s Secret으로 관리 (아래는 Secret 이름만 지정)
secret:
  name: my-service-secret
  keys:
    secretKey: SECRET_KEY
    databaseUrl: DATABASE_URL

# Liveness / Readiness Probe
livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 15
  periodSeconds: 20
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3

# ConfigMap으로 마운트할 설정 파일
configMap:
  enabled: true

# PodDisruptionBudget — 롤링 업데이트 시 최소 가용 Pod 수
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# 노드 어피니티 / 톨러레이션 (필요 시 설정)
nodeSelector: {}
tolerations: []
affinity: {}
